name: Vérifier, construire et déployer

# Sécurité de la chaîne (ADR-0015) : actions épinglées par commit (mises à jour par Dependabot), droits
# minimaux par job, Node LTS au dernier correctif à chaque exécution, audit des dépendances, clé d'hôte SSH
# vérifiée, déploiements sérialisés. Dépôt public : seul un tag de version (v*) déploie, après approbation
# sur l'environnement production ; un push sur main ne fait que vérifier et construire l'image.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # 26 : LTS active (image de production) ; 24 : LTS de maintenance (postes de développement).
        node: [26, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          check-latest: true
          cache: npm
      - run: npm ci --no-audit --no-fund
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
      - name: Audit des dépendances d'exécution
        run: npm audit --omit=dev --audit-level=high
      - run: npm run check

  build-and-push:
    needs: check
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=sha,prefix=,format=long
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          # Image de base revérifiée à chaque build (correctifs Alpine appliqués dans le Dockerfile).
          pull: true
          provenance: true
          sbom: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    # Tags de version seulement ; désactivé tant que le serveur n'est pas configuré (DEPLOY_PATH absente).
    if: startsWith(github.ref, 'refs/tags/v') && vars.DEPLOY_PATH != ''
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Copier compose.yaml sur le serveur
        uses: appleboy/scp-action@ff85246acaad7bdce478db94a363cd2bf7c90345 # v1.0.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          fingerprint: ${{ secrets.SSH_FINGERPRINT }}
          source: compose.yaml
          target: ${{ vars.DEPLOY_PATH }}
      - name: Déployer l'image de ce commit
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        env:
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
          GHCR_USER: ${{ github.repository_owner }}
          IMAGE_TAG: ${{ github.sha }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          fingerprint: ${{ secrets.SSH_FINGERPRINT }}
          envs: GHCR_TOKEN,GHCR_USER,IMAGE_TAG,DEPLOY_PATH
          script: |
            set -eu
            cd "$DEPLOY_PATH"
            # Configuration Docker jetable : le compte SSH garde ses propres identifiants ghcr.io
            # (autres images), qu'un login/logout dans ~/.docker écraserait puis effacerait.
            export DOCKER_CONFIG="$(mktemp -d)"
            trap 'rm -rf "$DOCKER_CONFIG"' EXIT
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            export IMAGE_TAG
            docker compose pull
            docker compose up -d --remove-orphans
            # Attendre que le conteneur soit sain, sinon échouer (retour arrière : voir deploy/README.md).
            for i in $(seq 1 30); do
              [ "$(docker inspect -f '{{.State.Health.Status}}' netvolution-studio)" = healthy ] && break
              sleep 2
            done
            docker inspect -f '{{.State.Health.Status}}' netvolution-studio | grep -q healthy
            docker image prune -f
