# Security and version updates (ADR-0015): actions (pinned by commit), Node image of the
# Dockerfile, npm dependencies. Each proposal goes through the CI (pull request) before merging.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # Types of the minimum supported version (engines: node >=24): no major upgrade.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
