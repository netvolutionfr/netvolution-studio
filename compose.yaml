# Netvolution Studio on the server (ADR-0015). Copied into the deployment folder by the GitHub
# workflow; IMAGE_TAG is set on each deployment. The port only listens on 127.0.0.1: only nginx
# (HTTPS + password) reaches it.
services:
  studio:
    image: ghcr.io/netvolutionfr/netvolution-studio:${IMAGE_TAG:-latest}
    container_name: netvolution-studio
    restart: unless-stopped
    ports:
      - "127.0.0.1:${NS_PORT:-3010}:8080"
    env_file:
      - path: .env
        required: false
    volumes:
      - ./data:/data
