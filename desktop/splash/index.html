<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <style>
      html { height: 100%; background: #f5f5f4; }
      body { height: 100%; margin: 0; display: grid; place-items: center; }
      i { width: 28px; height: 28px; border: 3px solid #d6d3d1; border-top-color: #57534e; border-radius: 50%; animation: s 0.8s linear infinite; }
      @keyframes s { to { transform: rotate(1turn); } }
      @media (prefers-reduced-motion: reduce) { i { animation: none; } }
    </style>
  </head>
  <body><i></i></body>
</html>
